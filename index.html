<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feed Court</title>
  <link rel="stylesheet" type="text/css" href="feedcourt.css">
  <link href="apple-touch-icon.png" rel="apple-touch-icon">
  <link href="apple-touch-icon-76x76.png" rel="apple-touch-icon" sizes="76x76">
  <link href="apple-touch-icon-120x120.png" rel="apple-touch-icon" sizes="120x120">
  <link href="apple-touch-icon-152x152.png" rel="apple-touch-icon" sizes="152x152">
  <link href="apple-touch-icon-180x180.png" rel="apple-touch-icon" sizes="180x180">
  <link href="icon-hires.png" rel="icon" sizes="192x192">
  <link href="icon-normal.png" rel="icon" sizes="128x128">
  <style>
    #status { color: #777; }
    #status.error { color: #de4e1c; max-width: 44rem; line-height: 1.5; }
    #status code { color: #aeaeae; }
  </style>
</head>
<body>
  <div id="header">
    <h1>Feed Court</h1>
    <p> | a wall of text rss aggregator | updated: <span id="utcupdate">loading</span> |
      <span class="sorter" id="viewlink"></span>
      <span class="sorter"><a href="#" id="refresh"> refresh </a></span>
    </p>
  </div>
  <div id="status">pulling feeds...</div>
  <div id="wrapper"></div>

<script>window.__freshBoot = (function(){ try { return __FRESH_BOOT__; } catch (e) { return false; } })();</script>
<script>
(function () {
  var view = /(\?|&)view=jumble/.test(location.search) ? 'jumble' : 'sort';
  var statusEl = document.getElementById('status');
  var wrapper = document.getElementById('wrapper');
  var stamp = document.getElementById('utcupdate');
  var viewlink = document.getElementById('viewlink');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
    });
  }

  function siteId(s) { return String(s).replace(/\s+/g, '').replace(/[\W_]+/g, ''); }

  function renderSort(sections) {
    var html = '';
    for (var i = 0; i < sections.length; i++) {
      var s = sections[i];
      var id = siteId(s.title);
      html += "<div class='section' id='" + esc(id) + "'>" +
              "<div class='section_head'>" +
              "<h2><a href='" + esc(s.link) + "'>" + esc(s.title) + "</a></h2>" +
              "<div class='more' id='more" + esc(id) + "'> more </div>" +
              "</div>";
      for (var j = 0; j < s.entries.length; j++) {
        var e = s.entries[j];
        html += "<div class='entry'><a href='" + esc(e.link) + "' target='_blank'>" +
                esc(e.title) + "</a></div>";
      }
      html += "</div>";
    }
    wrapper.className = '';
    wrapper.id = 'wrapper';
    wrapper.innerHTML = html;
  }

  function renderJumble(sections) {
    var rows = [];
    for (var i = 0; i < sections.length; i++) {
      var s = sections[i];
      for (var j = 0; j < s.entries.length; j++) {
        var e = s.entries[j];
        rows.push("<span class='jumble'> <a href='" + esc(e.link) + "' target='_blank'>" +
                  esc(e.title) + "</a><span class='jumblesite'><a href='" + esc(s.link) +
                  "'> ( " + esc(s.title) + " ) </a></span></span> | ");
      }
    }
    for (var k = rows.length - 1; k > 0; k--) {
      var m = Math.floor(Math.random() * (k + 1));
      var tmp = rows[k]; rows[k] = rows[m]; rows[m] = tmp;
    }
    wrapper.className = 'jumblewrapper';
    wrapper.id = 'jumblewrapper';
    wrapper.innerHTML = rows.join('');
  }

  function showHeader(data) {
    stamp.textContent = data.updated;
    var bits = [data.feeds_ok + ' of ' + data.feeds_total + ' feeds'];
    if (data.stale) { bits.push(data.stale + ' stale'); }
    if (data.failed.length) { bits.push(data.failed.length + ' unavailable'); }
    bits.push(data.elapsed + 's');
    statusEl.className = '';
    statusEl.textContent = bits.join(' \u00b7 ');
    statusEl.title = data.failed.join('\n');
    viewlink.innerHTML = view === 'jumble'
      ? "<a href='./'> sort </a>"
      : "<a href='./?view=jumble'> jumble </a>";
  }

  function load(force) {
    statusEl.className = '';
    statusEl.textContent = 'pulling feeds...';
    stamp.textContent = 'loading';
    var url = 'api/feeds' + (force ? '?fresh=1' : '');
    var started = Date.now();
    fetch(url, {cache: 'no-store'})
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        showHeader(data);
        if (view === 'jumble') { renderJumble(data.sections); }
        else { renderSort(data.sections); }
        if (typeof loadroutine === 'function') { loadroutine(); }
        if (force) { statusEl.textContent += ' (' + ((Date.now() - started) / 1000).toFixed(1) + 's)'; }
      })
      .catch(function (err) {
        statusEl.className = 'error';
        if (location.protocol === 'file:') {
          statusEl.innerHTML = 'This page needs the little server, because browsers block ' +
            'cross-site feed reads. In a terminal: <code>cd ~/rssfeedz &amp;&amp; ' +
            './server.py</code>, then open <code>http://localhost:8111/</code>.';
        } else {
          statusEl.textContent = 'Could not reach the feed server: ' + err.message +
            '. Is ./server.py still running?';
        }
      });
  }

  document.getElementById('refresh').addEventListener('click', function (ev) {
    ev.preventDefault();
    load(true);
  });

  load(!!window.__freshBoot);
})();
</script>
<script src="feedcourt.js" type="text/javascript"></script>
</body>
</html>
