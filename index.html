<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feed Court</title>
  <link rel="stylesheet" type="text/css" href="feedcourt.css">
  <link href="apple-touch-icon.png" rel="apple-touch-icon">
  <link href="icon-hires.png" rel="icon" sizes="192x192">
  <link href="icon-normal.png" rel="icon" sizes="128x128">
</head>
<body>
  <header class="top">
    <div class="brand">Feed Court</div>
    <nav class="views">
      <a href="./" class="on">grid</a>
      <a href="./?view=jumble">wire</a>
      <a href="#" id="refresh">refresh</a>
    </nav>
    <div class="stamp"><span id="status">pulling feeds</span></div>
  </header>

  <div class="ticker" id="ticker"></div>

  <main id="grid" class="grid"></main>

  <footer class="foot">
    <span id="updated">loading</span> ·
    <a href="https://github.com/Opfour/rssfeedz">source</a>
  </footer>

<script>window.__freshBoot = (function(){ try { return __FRESH_BOOT__; } catch (e) { return false; } })();</script>
<script src="feedcourt-app.js"></script>
</body>
</html>
