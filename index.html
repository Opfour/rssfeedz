<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feed Court</title>
  <link rel="stylesheet" type="text/css" href="feedcourt.css">
  <link href="apple-touch-icon.png" rel="apple-touch-icon">
  <link href="icon-hires.png" rel="icon" sizes="192x192">
  <link href="icon-normal.png" rel="icon" sizes="128x128">
</head>
<body>
  <header class="top">
    <div class="brand">Feed Court</div>
    <nav class="views">
      <a href="./" class="on">grid</a>
      <a href="./?view=jumble">wire</a>
      <a href="#" id="refresh">refresh</a>
    </nav>
    <div class="stamp"><span id="status">pulling feeds</span></div>
  </header>

  <div class="ticker" id="ticker"></div>

  <main id="grid" class="grid"></main>

  <footer class="foot">
    <span id="updated">loading</span> ·
    <a href="https://github.com/Opfour/rssfeedz">source</a>
  </footer>

<script>window.__freshBoot = (function(){ try { return __FRESH_BOOT__; } catch (e) { return false; } })();</script>
<script>
(function () {
  var view = /(\?|&)view=jumble/.test(location.search) ? 'wire' : 'grid';
  var statusEl = document.getElementById('status');
  var gridEl = document.getElementById('grid');
  var tickerEl = document.getElementById('ticker');
  var updatedEl = document.getElementById('updated');
  var VISIBLE_ROWS = 6;     // rows shown before "more"
  // Only image-first and video-first sources get art. Every news, tech, magazine
  // and subreddit feed renders as text, so the wall stays typographic.
  var IMAGE_OK = /youtube|youtu\.be|vimeo|flickr|instagram|bigpicture|in-?focus|photo/i;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
    });
  }

  function hue(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) % 360; }
    return h;
  }

  function badge(domain, title) {
    var letter = (domain || title || '?').replace(/^www\./, '').charAt(0).toUpperCase();
    return '<span class="badge" style="background:hsl(' + hue(domain || title) +
           ',55%,42%)">' + esc(letter) + '</span>';
  }

  function ago(ts) {
    if (!ts) { return ''; }
    var mins = Math.max(0, Math.round((Date.now() / 1000 - ts) / 60));
    if (mins < 60) { return mins + 'm'; }
    if (mins < 1440) { return Math.round(mins / 60) + 'h'; }
    return Math.round(mins / 1440) + 'd';
  }

  function imgTag(src, cls, eager) {
    return '<img class="' + cls + '" ' + (eager ? '' : 'loading="lazy" ') +
           'decoding="async" referrerpolicy="no-referrer" src="' + esc(src) +
           '" alt="" onerror="this.style.visibility=\'hidden\'">';
  }

  function leadFor(section) {
    if (!IMAGE_OK.test((section.domain || '') + ' ' + (section.title || ''))) { return -1; }
    for (var i = 0; i < section.entries.length; i++) {
      if (section.entries[i].image) { return i; }
    }
    return -1;
  }

  function card(section) {
    var lead = leadFor(section);
    var head = '<div class="card-head">' + badge(section.domain, section.title) +
      '<h2><a href="' + esc(section.link) + '">' + esc(section.title) +
      (section.domain ? '<span class="dom">' + esc(section.domain) + '</span>' : '') +
      '</a></h2>' +
      (section.entries.length > VISIBLE_ROWS ? '<button class="more" type="button">more</button>' : '') +
      '</div>';

    var leadHtml = '';
    var entries = section.entries;
    if (lead >= 0) {
      var e = entries[lead];
      leadHtml = '<a class="lead" href="' + esc(e.link) + '" target="_blank" rel="noopener">' +
        imgTag(e.image, 'lead-img') + '<span class="lead-t">' + esc(e.title) + '</span></a>';
      entries = entries.slice(0, lead).concat(entries.slice(lead + 1));
    }

    var rows = '';
    for (var i = 0; i < entries.length; i++) {
      var x = entries[i];
      rows += '<a class="row' + (i >= VISIBLE_ROWS ? ' extra' : '') + '" href="' + esc(x.link) +
              '" target="_blank" rel="noopener"><span class="row-t">' + esc(x.title) + '</span>' +
              (x.video ? '<span class="play" title="video">▶</span>' : '') + '</a>';
    }

    return '<article class="card" data-id="' + esc(section.id) + '">' + head + leadHtml +
           '<div class="rows">' + rows + '</div></article>';
  }

  function wireCard(section) {
    var entries = section.entries.slice();
    var lead = null, rest = [];
    var allowArt = IMAGE_OK.test((section.domain || '') + ' ' + (section.title || ''));
    for (var i = 0; i < entries.length; i++) {
      if (allowArt && !lead && entries[i].image) { lead = entries[i]; } else { rest.push(entries[i]); }
    }
    var html = '<article class="card wide reuters' + (lead ? '' : ' noimg') + '">' +
      '<div class="card-head">' + badge(section.domain, section.title) +
      '<h2><a href="' + esc(section.link) + '">' + esc(section.title) +
      '<span class="dom">' + esc(section.domain) + '</span></a></h2></div>' +
      '<div class="reuters-body">';
    if (lead) {
      html += '<a class="reuters-lead" href="' + esc(lead.link) + '" target="_blank" rel="noopener">' +
        imgTag(lead.image, 'lead-img') + '<span class="lead-t">' + esc(lead.title) + '</span>' +
        '<span class="when">' + ago(lead.published) + '</span></a>';
    }
    html += '<div class="reuters-list">';
    for (var j = 0; j < rest.length && j < 12; j++) {
      var e = rest[j];
      html += '<a class="wire-row" href="' + esc(e.link) + '" target="_blank" rel="noopener">' +
        '<span class="when">' + ago(e.published) + '</span>' +
        '<span class="row-t">' + esc(e.title) + '</span></a>';
    }
    html += '</div></div></article>';
    return html;
  }

  function collectMedia(sections) {
    var buckets = [], seen = {};
    for (var i = 0; i < sections.length; i++) {
      var s = sections[i];
      var bucket = [];
      if (!IMAGE_OK.test((s.domain || '') + ' ' + (s.title || ''))) { buckets.push(bucket); continue; }
      for (var j = 0; j < s.entries.length; j++) {
        var e = s.entries[j];
        if (!e.image || e.video) { continue; }
        var item = {img: e.image, link: e.link, title: e.title,
                    src: s.domain || s.title, video: false};
        if (bucket.length < 2) { bucket.push(item); }
      }
      buckets.push(bucket);
    }
    // round robin across sections so a strip is never all one publisher
    var photos = [], depth = 0, added = true;
    while (added) {
      added = false;
      for (var k = 0; k < buckets.length; k++) {
        var it = buckets[k][depth];
        if (it && !seen[it.img]) { seen[it.img] = 1; photos.push(it); added = true; }
        else if (it) { added = true; }
      }
      depth++;
      if (depth > 4) { break; }
    }
    return {photos: photos};
  }

  function strip(items, kind) {
    var cells = '';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      cells += '<a class="shot' + (kind === 'video' ? ' vid' : '') + '" href="' + esc(it.link) +
        '" target="_blank" rel="noopener">' + imgTag(it.img, 'shot-img', true) +
        '<span class="cap">' + esc(it.title) + '</span>' +
        '<span class="cap-src">' + esc(it.src) + '</span>' +
        (kind === 'video' ? '<span class="play big">▶</span>' : '') + '</a>';
    }
    return '<section class="strip ' + kind + '"><div class="strip-head">' +
      (kind === 'video' ? 'video' : 'photos') + '</div><div class="strip-grid">' + cells + '</div></section>';
  }

  var WIRE = /reuters|apnews/i;

  function rank(section) {
    var key = (section.domain || '') + ' ' + (section.title || '');
    if (/reuters/i.test(key)) { return 0; }
    if (/apnews/i.test(key)) { return 1; }
    return 2;
  }

  function hasWire(section) {
    return WIRE.test((section.domain || '') + ' ' + (section.title || ''));
  }

  function ordered(sections) {
    return sections.slice().sort(function (a, b) { return rank(a) - rank(b); });
  }

  function newestOf(section) {
    var best = 0;
    for (var i = 0; i < section.entries.length; i++) {
      if (section.entries[i].published > best) { best = section.entries[i].published; }
    }
    return best;
  }

  function renderGrid(data) {
    var html = '', i, since = 0, photoIdx = 0;
    var media = collectMedia(data.sections);
    var order = ordered(data.sections), textCards = [], videoCards = [];
    for (i = 0; i < order.length; i++) {
      if (hasWire(order[i])) { html += wireCard(order[i]); }
      else if (IMAGE_OK.test((order[i].domain || '') + ' ' + (order[i].title || ''))) { videoCards.push(order[i]); }
      else { textCards.push(order[i]); }
    }
    // video cards sit on full rows of three, freshest first, never a partial row
    videoCards.sort(function (a, b) { return newestOf(b) - newestOf(a); });
    if (videoCards.length >= 3) {
      videoCards = videoCards.slice(0, Math.floor(videoCards.length / 3) * 3);
    }
    if (videoCards.length) {
      html += '<div class="rowbreak"></div>';
      for (i = 0; i < videoCards.length; i++) { html += card(videoCards[i]); }
      html += '<div class="rowbreak"></div>';
    }
    for (i = 0; i < textCards.length; i++) {
      html += card(textCards[i]);
      since++;
      if (since === 6 && photoIdx < media.photos.length) {
        html += strip(media.photos.slice(photoIdx, photoIdx + 5), 'photos');
        photoIdx += 5;
        since = 0;
      }
    }
    if (photoIdx < media.photos.length) {
      html += strip(media.photos.slice(photoIdx, photoIdx + 5), 'photos');
    }
    gridEl.className = 'grid';
    gridEl.innerHTML = html;
  }

  function renderWire(data) {
    var rows = [];
    for (var i = 0; i < data.sections.length; i++) {
      for (var j = 0; j < data.sections[i].entries.length; j++) {
        rows.push({e: data.sections[i].entries[j], s: data.sections[i]});
      }
    }
    for (var k = rows.length - 1; k > 0; k--) {
      var m = Math.floor(Math.random() * (k + 1));
      var t = rows[k]; rows[k] = rows[m]; rows[m] = t;
    }
    var html = '';
    for (var n = 0; n < rows.length; n++) {
      var r = rows[n];
      html += '<a class="wire-row" href="' + esc(r.e.link) + '" target="_blank" rel="noopener">' +
        '<span class="wire-src">' + esc(r.s.domain || r.s.title) + '</span>' +
        '<span class="row-t">' + esc(r.e.title) + '</span>' +
        (r.e.video ? '<span class="play">▶</span>' : '') + '</a>';
    }
    gridEl.className = 'wire';
    gridEl.innerHTML = html;
  }

  var NEWS = /reuters|apnews|cnn|bbc|nytimes|guardian|npr|washingtonpost|wsj|aljazeera|axios|politico|thehill/i;

  function renderTicker(data) {
    var items = [], order = ordered(data.sections), i, s;
    for (i = 0; i < order.length && items.length < 8; i++) {
      s = order[i];
      if (!NEWS.test(s.domain) || !s.entries.length) { continue; }
      items.push('<a href="' + esc(s.entries[0].link) + '" target="_blank">' + esc(s.entries[0].title) + '</a>');
    }
    for (i = 0; i < order.length && items.length < 8; i++) {
      s = order[i];
      if (!s.entries.length || NEWS.test(s.domain)) { continue; }
      items.push('<a href="' + esc(s.entries[0].link) + '" target="_blank">' + esc(s.entries[0].title) + '</a>');
    }
    if (!items.length) { tickerEl.innerHTML = ''; return; }
    var line = items.join('<span class="sep">·</span>') + '<span class="sep">·</span>';
    tickerEl.innerHTML =
      '<div class="ticker-track">' + line + '</div>' +
      '<div class="ticker-track" aria-hidden="true">' + line + '</div>';
    var width = tickerEl.firstChild.scrollWidth || 1200;
    tickerEl.style.setProperty('--dur', Math.max(20, Math.round(width / 55)) + 's');
  }

  function showStatus(data) {
    var bits = [data.feeds_ok + '/' + data.feeds_total + ' feeds'];
    if (data.failed.length) { bits.push(data.failed.length + ' down'); }
    bits.push(data.elapsed + 's');
    statusEl.textContent = bits.join(' · ');
    statusEl.title = data.failed.join('\n');
    updatedEl.textContent = new Date(data.updated).toLocaleString();
  }

  function load(force) {
    statusEl.textContent = 'pulling feeds';
    var url = 'api/feeds' + (force ? '?fresh=1' : '');
    fetch(url, {cache: 'no-store'})
      .then(function (r) { if (!r.ok) { throw new Error('HTTP ' + r.status); } return r.json(); })
      .then(function (data) {
        showStatus(data);
        renderTicker(data);
        if (view === 'wire') { renderWire(data); } else { renderGrid(data); }
      })
      .catch(function (err) {
        statusEl.textContent = location.protocol === 'file:'
          ? 'needs the local server: cd ~/rssfeedz && ./server.py, then open http://localhost:8111/'
          : 'feed server unreachable: ' + err.message;
      });
  }

  gridEl.addEventListener('click', function (ev) {
    var btn = ev.target.closest ? ev.target.closest('.more') : null;
    if (!btn) { return; }
    var cardEl = btn.closest('.card');
    var expanded = cardEl.classList.toggle('open');
    btn.textContent = expanded ? 'less' : 'more';
  });

  document.getElementById('refresh').addEventListener('click', function (ev) {
    ev.preventDefault();
    load(true);
  });

  load(!!window.__freshBoot);
})();
</script>
</body>
</html>
